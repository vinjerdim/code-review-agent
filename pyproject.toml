[project]
name = "reviewer"
version = "0.1.0"
description = "LLM-powered pull request review agent that runs as a GitHub Action."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "PyGithub>=2.3",
]

[project.scripts]
reviewer = "reviewer.main:main"

[dependency-groups]
dev = [
    "actionlint-py>=1.7",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reviewer"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
